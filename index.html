<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Holiday packing list</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6E7457">
<meta name="apple-mobile-web-app-title" content="Packing">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f7f6f3;
    --surface-0: #fafaf8;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #e5e4df;
    --border-strong: #c9c7c0;
    --border-accent: #185fa5;
    --bg-accent: #e6f1fb;
    --text-accent: #185fa5;
    --bg-danger: #fcebeb;
    --text-danger: #a32d2d;
    --border-danger: #e24b4a;
    --shadow-popover: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #page { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
  .topbar h1 { font-size: 18px; font-weight: 500; margin: 0; }
  .reset-btn { background:none; border:0.5px solid var(--border); border-radius:var(--radius); padding:6px 14px; font-size:13px; color:var(--text-secondary); cursor:pointer; display:none; align-items:center; gap:6px; }
  .reset-btn:hover { border-color:var(--border-danger); color:var(--text-danger); }
  .reset-btn.show { display:inline-flex; }
  #undo-btn:hover:not(:disabled) { border-color:var(--border-accent); color:var(--text-primary); }
  #undo-btn:disabled { opacity:.4; cursor:default; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  #app .lead { text-align:center; font-size:15px; color:var(--text-secondary); margin:0 auto 1.75rem; }

  #screen-bags, #screen-pack { padding:0 10px; }

  /* With a bag open on a wide screen, the item list sits beside it and stays in view */
  #page { transition:max-width .35s ease; }
  body.studio-open #page { max-width:1300px; }
  .side-head { display:none; }
  /* Narrow: one column with the items right under the bag. Wide (below): bag column + item column */
  .pack-grid { display:flex; flex-direction:column; }
  .pack-main { display:contents; }
  #studio { order:1; } #side { order:2; } .pack-main > :not(#studio) { order:3; }
  .search { display:flex; align-items:center; gap:6px; border:0.5px solid var(--border-strong); border-radius:10px; background:var(--surface-2); padding:6px 10px; margin-top:12px; }
  .search i { color:var(--text-muted); font-size:15px; }
  .search input { flex:1; border:none; background:none; font-size:13px; color:var(--text-primary); outline:none; min-width:0; }
  @media (min-width:1100px){
    body.studio-open .pack-main { display:block; }
    body.studio-open .pack-grid { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start; }
    body.studio-open #side { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; overscroll-behavior:contain; padding:0 4px 12px 2px; }
    body.studio-open .side-head { display:block; position:sticky; top:0; z-index:3; background:var(--surface-0); padding:14px 0 6px; }
    body.studio-open .side-title { font-size:14px; font-weight:500; }
    body.studio-open .side-title span { font-size:12px; font-weight:400; color:var(--text-muted); margin-left:4px; }
    body.studio-open .search { margin-top:8px; }
    body.studio-open #drawers .drawer:first-child { margin-top:4px; }
    body.studio-open #drawers .chip-grid { grid-template-columns:repeat(auto-fill, minmax(86px,1fr)); gap:6px; }
    body.studio-open #drawers .chip { padding:9px 4px 7px; gap:5px; }
    body.studio-open #drawers .chip i { font-size:30px; }
  }
  .bag-grid { display:grid; grid-template-columns:repeat(5, minmax(90px,1fr)); gap:14px; padding:.5rem 0 1rem; }
  .bag-card { position:relative; display:flex; flex-direction:column; align-items:center; gap:9px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem .5rem .8rem; cursor:pointer; animation:bob 3.6s ease-in-out infinite; transition:transform .18s ease, border-color .18s ease; }
  .bag-card:hover { border-color:var(--border-accent); animation:none; }
  .bag-card::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .2s ease; background:radial-gradient(circle at var(--mx,50%) var(--my,30%), rgba(255,255,255,.7), transparent 55%); }
  .bag-card:hover::after { opacity:1; }
  .bag-card .bag-art { transition:transform .2s ease; transform:translateZ(30px); }
  .bag-card.picked .bag-art { animation:hop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop { 0%{ transform:translateY(0); } 40%{ transform:translateY(-14px) rotate(-6deg); } 100%{ transform:none; } }
  .bag-card .tag { position:absolute; top:-6px; right:10px; transform-origin:50% 0; width:22px; height:30px; border-radius:4px 4px 6px 6px; background:#EF9F27; color:#fff; font-size:12px; font-weight:600; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; box-sizing:border-box; box-shadow:0 3px 6px rgba(0,0,0,.2); transform:rotate(8deg); }
  .bag-card .tag::before { content:''; position:absolute; top:4px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--surface-2); }
  .bag-card .tag::after { content:''; position:absolute; top:-9px; left:50%; width:1.5px; height:10px; background:#854F0B; }
  .bag-card.picked .tag { animation:tagSwing 1.1s cubic-bezier(.3,1.4,.5,1); }
  @keyframes tagSwing { 0%{ transform:translateY(-30px) rotate(-40deg); opacity:0; } 35%{ opacity:1; transform:rotate(28deg); } 60%{ transform:rotate(-6deg); } 80%{ transform:rotate(12deg); } 100%{ transform:rotate(8deg); } }
  .flight { position:relative; width:600px; max-width:100%; height:92px; margin:-6px auto 4px; overflow:hidden; }
  .flight > svg { position:absolute; left:0; top:0; width:600px; height:92px; }
  .flight .plane svg { display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
  .flight .plane { position:absolute; left:0; top:0; width:26px; height:26px; color:var(--text-accent); offset-path:path('M30 76 C 170 8, 430 8, 570 66'); offset-rotate:auto; animation:fly 7s cubic-bezier(.45,0,.35,1) infinite; }
  @keyframes fly { 0%{ offset-distance:0%; opacity:0; } 8%{ opacity:1; } 88%{ opacity:1; } 100%{ offset-distance:100%; opacity:0; } }
  .flight .cloud { position:absolute; height:14px; border-radius:14px; background:var(--surface-2); box-shadow:12px -7px 0 2px var(--surface-2), 26px 0 0 0 var(--surface-2); opacity:.9; animation:drift linear infinite; }
  @keyframes drift { from{ transform:translateX(-60px); } to{ transform:translateX(660px); } }
  .tray { display:flex; align-items:center; justify-content:center; gap:10px; margin:2px 0 4px; }
  .tray .slot { width:54px; height:54px; border-radius:12px; border:1.5px dashed var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:18px; }
  .tray .slot.full { border:1.5px solid var(--border-accent); background:var(--bg-accent); animation:slotIn .45s cubic-bezier(.3,1.6,.5,1); }
  .tray .slot.full svg { width:auto; height:40px; }
  @keyframes slotIn { 0%{ transform:scale(.6); } 100%{ transform:none; } }
  .tray-label { text-align:center; font-size:12px; color:var(--text-muted); }
  .cta.go { position:relative; overflow:hidden; border-color:var(--border-accent); color:var(--text-accent); font-weight:500; }
  .cta.go::after { content:''; position:absolute; top:0; bottom:0; width:40%; left:-50%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); animation:shimmer 2.4s ease-in-out infinite; }
  @keyframes shimmer { 0%{ left:-50%; } 60%,100%{ left:120%; } }
  .bag-card.selected { border:2px solid var(--border-accent); background:var(--bg-accent); animation-play-state:paused; transform:translateY(-2px); }
  .bag-card.selected .bag-label { color:var(--text-accent); }
  .bag-card.shake, .bag.shake { animation:shake .4s; }
  .bag-label { font-size:11px; color:var(--text-secondary); text-align:center; }

  .btnrow { display:flex; justify-content:space-between; align-items:center; margin-top:1rem; }
  .linkbtn { background:none; border:none; color:var(--text-secondary); font-size:13px; cursor:pointer; padding:6px 4px; }
  .linkbtn:hover { color:var(--text-primary); }
  .cta { background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:var(--radius); padding:8px 18px; font-size:14px; cursor:pointer; }
  .cta:hover { background:var(--surface-1); }
  .cta:disabled { opacity:.4; cursor:not-allowed; }

  .dock { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .bag { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:12px 10px 10px; flex:1; min-width:120px; max-width:180px; cursor:pointer; transition:transform .2s ease, border-color .2s ease, background .2s ease; }
  .bag .no-pe { pointer-events:none; }
  .bag .bag-svg { transition:transform .25s ease; }
  .bag.drop-ready { border:2px solid var(--border-accent); background:var(--bg-accent); transform:translateY(-4px) scale(1.04); }
  .bag.drop-ready .bag-svg { transform:translateY(-6px) scale(1.06) rotate(-2deg); }
  .bag .mouth { position:absolute; top:4px; left:12px; right:44px; height:20px; border:2px dashed var(--border-accent); border-radius:10px 10px 4px 4px; opacity:0; transition:opacity .2s ease; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-accent); }
  .bag.drop-ready .mouth { opacity:1; }
  .bag .bag-name { font-size:11px; color:var(--text-secondary); text-align:center; }
  .bag .count { font-size:11px; color:var(--text-accent); }
  .bag .open-btn { position:absolute; top:6px; right:6px; pointer-events:auto; width:26px; height:26px; border-radius:8px; border:0.5px solid var(--border); background:var(--surface-1); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5; }
  .bag .open-btn i { font-size:16px; }
  .bag .open-btn:hover { border-color:var(--border-accent); color:var(--text-accent); background:var(--surface-2); }

  .peek { position:absolute; left:0; right:0; z-index:20; background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow-popover); display:none; }
  .peek h4 { font-size:13px; margin:0 0 2px; color:var(--text-secondary); font-weight:500; }
  .peek .grp { margin-bottom:8px; }
  .peek .grp:last-child { margin-bottom:0; }
  .peek .pit { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text-primary); background:var(--surface-1); border-radius:20px; padding:3px 9px; margin:3px 4px 0 0; }
  .peek .pit i { font-size:14px; color:var(--text-secondary); }
  .peek .empty { font-size:12px; color:var(--text-muted); }
  .peek .hint { font-size:11px; color:var(--text-muted); margin-top:6px; }

  .drawer { border:0.5px solid var(--border); border-radius:12px; margin-top:12px; overflow:hidden; background:var(--surface-2); }
  .drawer-head { display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; padding:13px 15px; cursor:pointer; font-size:15px; color:var(--text-primary); text-align:left; }
  .drawer-head i.dh-icon { font-size:20px; color:var(--text-secondary); }
  .drawer-head .chev { margin-left:auto; font-size:18px; color:var(--text-muted); transition:transform .2s ease; }
  .drawer.open .chev { transform:rotate(180deg); }
  .drawer-body { display:none; padding:4px 15px 15px; }
  .drawer.open .drawer-body { display:block; }
  .subhead { font-size:12px; color:var(--text-muted); margin:12px 0 8px; }
  .chip-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:8px; }
  .chip { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px 6px 10px; background:var(--surface-1); border:0.5px solid var(--border); border-radius:10px; cursor:grab; text-align:center; transition:border-color .15s ease, transform .1s ease; }
  .chip:hover { border-color:var(--border-accent); }
  .chip:active { cursor:grabbing; transform:scale(.96); }
  .chip i { font-size:40px; color:var(--text-secondary); }
  i.ico { display:inline-flex; font-style:normal; line-height:1; }
  i.ico svg { display:block; }
  .chip .nm { font-size:10px; color:var(--text-primary); line-height:1.25; }
  .chip .qty { position:absolute; top:4px; right:6px; font-size:10px; color:var(--text-muted); }

  .bin { margin-top:14px; border:1px dashed var(--border-strong); border-radius:12px; padding:10px 14px; background:var(--surface-1); transition:border-color .2s ease, background .2s ease; }
  .bin.drop-ready { border-color:var(--border-danger); background:var(--bg-danger); }
  .bin-head { display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:var(--text-secondary); }
  .bin-head i { font-size:18px; }
  .bin.drop-ready .bin-head { color:var(--text-danger); }
  .bin-list { display:none; margin-top:10px; }
  .bin.expanded .bin-list { display:block; }
  .bin .pit { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text-secondary); background:var(--surface-2); border:0.5px solid var(--border); border-radius:20px; padding:3px 9px; margin:3px 4px 0 0; cursor:pointer; }
  .bin .pit i { font-size:14px; }
  .bin .pit:hover { border-color:var(--border-accent); color:var(--text-accent); }

  .add-wrap { margin-top:14px; }
  .add-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:none; border:1px dashed var(--border-strong); border-radius:12px; padding:12px; font-size:14px; color:var(--text-secondary); cursor:pointer; }
  .add-btn:hover { border-color:var(--border-accent); color:var(--text-accent); }
  .add-form { display:none; margin-top:12px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; }
  .add-form.open { display:block; }
  .add-form label { font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px; }
  .add-form input[type="text"] { height:36px; border-radius:var(--radius); border:0.5px solid var(--border); padding:0 10px; font-size:14px; background:var(--surface-1); color:var(--text-primary); }
  .icon-pick { display:grid; grid-template-columns:repeat(auto-fill, minmax(44px,1fr)); gap:8px; margin:10px 0 14px; }
  .icon-pick button { height:40px; border:0.5px solid var(--border); border-radius:10px; background:var(--surface-1); color:var(--text-secondary); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .icon-pick button:hover { border-color:var(--border-accent); }
  .icon-pick button.sel { border:2px solid var(--border-accent); background:var(--bg-accent); color:var(--text-accent); }
  .add-actions { display:flex; justify-content:flex-end; gap:10px; align-items:center; }

  .modal-overlay { position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:12px; padding:16px 20px 20px; max-width:440px; width:100%; }
  .modal-box .m-head { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .modal-box .m-title { font-size:16px; color:var(--text-primary); }
  .modal-box .m-close { margin-left:auto; background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:22px; line-height:1; }
  .modal-box .m-count { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
  .modal-box .m-sub { font-size:12px; color:var(--text-muted); margin:14px 0 4px; }
  .modal-box .m-item { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text-primary); padding:7px 0; border-bottom:0.5px solid var(--border); }
  .modal-box .m-item i.mi { font-size:18px; color:var(--text-secondary); }
  .modal-box .m-un { margin-left:auto; font-size:11px; color:var(--text-secondary); background:none; border:0.5px solid var(--border); border-radius:20px; padding:3px 10px; cursor:pointer; }
  .modal-box .m-un:hover { border-color:var(--border-danger); color:var(--text-danger); }
  .modal-box .m-empty { font-size:13px; color:var(--text-muted); padding:12px 0; }

  .studio { margin-top:14px; border:0.5px solid var(--border); border-radius:12px; background:var(--surface-2); padding:14px 16px; }
  .studio-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .studio-head b { font-size:15px; font-weight:500; }
  .studio-dim { font-size:12px; color:var(--text-muted); }
  .studio-msg { font-size:12px; color:var(--text-danger); opacity:0; transition:opacity .2s ease; }
  .studio-msg.show { opacity:1; }
  #studio-close { margin-left:auto; }
  .pal { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .pal-tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 10px; border:0.5px solid var(--border); border-radius:10px; background:var(--surface-1); cursor:grab; font-size:11px; color:var(--text-primary); touch-action:none; user-select:none; }
  .pal-tile:hover { border-color:var(--border-accent); }
  .pal-tile .mini { display:block; border:1.5px solid var(--text-secondary); border-radius:3px; background:var(--surface-2); }
  .pal-tile .mini.kind-misc { border-style:dashed; }
  .pal-tile .mini.kind-wash { background:repeating-linear-gradient(45deg, #f4f4f2 0 3px, #dcdcd8 3px 4px); border-color:#2456c8; border-radius:6px; box-shadow:inset 0 2px 0 #2456c8; }
  .pal-tile .mini.kind-hard { background:#262624; border-color:#262624; border-radius:7px; }
  .pal-tile .mini.kind-hard-grey { background:#c3c3bf; border-color:#a9a9a4; border-radius:7px; }
  .pal-tile .mini.kind-tech { background:linear-gradient(#5f5e5a 0 62%, #1f1f1d 62%); border-color:#1f1f1d; border-radius:6px; }
  .pal-dim { color:var(--text-muted); font-size:10.5px; }
  /* 3D bag scene: tilted and zipped shut, then it unzips, the lid swings open flat and the bag settles top-down */
  .stage { perspective:1600px; perspective-origin:50% 30%; display:flex; justify-content:center; padding:20px 0 10px; }
  .scene { position:relative; transform-style:preserve-3d; transform:translateY(30px) rotateX(38deg) scale(.72); opacity:0; transition:opacity .3s ease, transform 1s cubic-bezier(.2,.8,.2,1) .95s; }
  .scene.open { transform:none; opacity:1; }
  /* Closing runs in reverse order: lid first, then the zip, then the tilt back */
  .scene.closing { transition:opacity .15s ease .9s, transform .4s cubic-bezier(.5,0,.5,1) .25s; }
  .scene.closing .lid { transition:transform .25s cubic-bezier(.45,.05,.25,1) 0s; }
  .scene.closing .zip .shut { transition:stroke-dashoffset .14s ease-out .22s; }
  .studio-closing .pal, .studio-closing #cube-editor, .studio-closing .studio-hint, .studio-closing .hanger, .studio-closing #studio-close { opacity:0; transition:opacity .15s ease; pointer-events:none; }
  .shell { position:relative; transform-style:preserve-3d; box-shadow:0 18px 30px -12px rgba(0,0,0,.45); }
  .shell.suitcase { border-radius:18px; }
  .shell.backpack { border-radius:46px 46px 22px 22px; }
  .shell .rimshade { position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:linear-gradient(160deg, rgba(255,255,255,.18), rgba(0,0,0,.18)); }
  .wall { position:absolute; left:0; right:0; top:100%; transform-origin:50% 0; transform:rotateX(-90deg); border-radius:0 0 14px 14px; background:linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.4)); }
  .interior { position:relative; border-radius:12px; background-image:linear-gradient(rgba(0,0,0,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px); box-shadow:inset 0 3px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.15); }
  .shell.backpack .interior { border-radius:36px 36px 14px 14px; }
  .lid { position:absolute; inset:0; border-radius:inherit; transform-style:preserve-3d; transition:transform 1.1s cubic-bezier(.45,.05,.25,1) .65s; }
  .shell.suitcase .lid { transform-origin:50% 0; }
  .shell.backpack .lid { transform-origin:50% 100%; }
  .scene.open .shell.suitcase .lid { transform:rotateX(180deg); }
  .scene.open .shell.backpack .lid { transform:rotateX(-180deg); }
  .lid-face { position:absolute; inset:0; box-sizing:border-box; border-radius:inherit; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; }

  function applyPayload(parsed){
    if(!parsed || !parsed.bags || !parsed.bags.length) return false;
    (parsed.custom || []).forEach(function(c){
      if(META[c.id]) return;
      var it = { n:c.n, i:c.i, s:'all', q:1, id:c.id };
      CUSTOM.items.push(it);
      META[c.id] = { id:c.id, name:c.n, icon:c.i, sub:'Added items', domain:'Custom' };
    });
    state.bags = parsed.bags;
    state.cubes = parsed.cubes || {};
    Object.keys(META).forEach(function(id){ state.items[id] = 'available'; });
    Object.keys(parsed.items || {}).forEach(function(id){
      var to = MOVED_IDS[id] || id;
      if(META[to]) state.items[to] = parsed.items[id];
    });
    return true;
  }

  function updateShareVisibility(){
    var btn = document.getElementById('share-btn');
    if(!btn) return;
    if(tripId) btn.classList.add('show'); else btn.classList.remove('show');
  }

  function subscribeRealtime(){
    if(!tripId) return;
    sbClient.channel('trip-'+tripId)
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'trips', filter:'id=eq.'+tripId }, function(payload){
        if(!payload.new || !payload.new.state) return;
        applyingRemote = true;
        applyPayload(payload.new.state);
        lastSnap = snapNow();
        if(document.getElementById('dock')){ renderDrawers(); renderBin(); updateBadges(); renderStudio(false); }
        else if(document.querySelector('.bag-grid')){ buildBags(); }
        applyingRemote = false;
      })
      .subscribe();
    updateShareVisibility();
  }

  function doSaveState(){
    if(applyingRemote) return;
    var payload = buildPayload();
    if(!tripId){
      sbClient.from('trips').insert({ state: payload }).select('id').single().then(function(res){
        if(res.data && res.data.id){
          tripId = res.data.id;
          var url = new URL(window.location.href);
          url.searchParams.set('trip', tripId);
          window.history.replaceState({}, '', url);
          subscribeRealtime();
        }
      });
    } else {
      sbClient.from('trips').update({ state: payload, updated_at: new Date().toISOString() }).eq('id', tripId).then(function(){});
    }
  }

  // Undo: every save records the previous snapshot, so each change can be stepped back
  var undoStack = [], lastSnap = null, undoing = false;
  function snapNow(){ return JSON.stringify(buildPayload()); }
  function recordHistory(){
    var snap = snapNow();
    if(!undoing && lastSnap!==null && snap!==lastSnap){ undoStack.push(lastSnap); if(undoStack.length>60) undoStack.shift(); }
    lastSnap = snap; updateUndoBtn();
  }
  function updateUndoBtn(){
    var b = document.getElementById('undo-btn'); if(!b) return;
    b.disabled = !undoStack.length;
    b.classList.toggle('show', !!(state.bags.length || undoStack.length));
  }
  function undo(){
    if(!undoStack.length) return;
    var snap = undoStack.pop(), p = JSON.parse(snap), bagsBefore = state.bags.join();
    state.bags = (p.bags||[]).slice(); state.cubes = p.cubes || {};
    Object.keys(META).forEach(function(id){ state.items[id] = 'available'; });
    Object.keys(p.items||{}).forEach(function(id){ if(META[id]) state.items[id] = p.items[id]; });
    if(selCube && !findCube(studioBag||'', selCube)) selCube = null;
    undoing = true; lastSnap = snap;
    if(scPack.style.display!=='none' && state.bags.length){ if(state.bags.join()!==bagsBefore) buildPack(); else refresh(); }
    else { buildBags(); show(scBags); saveState(); }
    undoing = false; updateUndoBtn();
  }

  function saveState(){
    recordHistory();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSaveState, 350);

  function loadState(){
    if(!tripId) return Promise.resolve(false);
    return sbClient.from('trips').select('state').eq('id', tripId).maybeSingle().then(function(res){
      if(res.error || !res.data || !res.data.state){ tripId = null; return false; }
      var ok = applyPayload(res.data.state);
      if(ok) subscribeRealtime();
      return ok;
    }).catch(function(){ tripId = null; return false; });
  }

    window.history.replaceState({}, '', url);
  }

  function addCustom(name, icon){
    var base = slug('custom-added-items-'+name); var id = base; var n=1;
    while(META[id]){ id = base+'-'+(n++); }
    var it = { n:name, i:icon, s:'all', q:1, id:id };
    CUSTOM.items.push(it);
    META[id] = { id:id, name:name, icon:icon, sub:'Added items', domain:'Custom' };
    state.items[id] = 'available';
    saveState();
    refresh();
    var cd = scPack.querySelector('.drawer[data-dom="Custom"]'); if(cd) cd.classList.add('open');
  }

  // Little motion helpers (skipped when the system asks for reduced motion)
  var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function replay(el, cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  // An item's icon arcs from the drop point into the target, which then "gulps"
  function flyTo(x, y, id, target, spin){
    if(REDUCE || !target || !META[id] || !document.body.animate) return;
    var m=META[id], f=document.createElement('div'); f.className='fly-item'; f.innerHTML=iconHtml(m.name, m.icon);
    f.style.left=x+'px'; f.style.top=y+'px'; document.body.appendChild(f);
    var r=target.getBoundingClientRect(), dx=r.left+r.width/2-x, dy=r.top+r.height/2-y;
    var a=f.animate([
      { transform:'translate(-50%,-50%) scale(1) rotate(0deg)', opacity:1 },
      { transform:'translate(calc(-50% + '+dx*0.5+'px), calc(-50% + '+(dy*0.5-90)+'px)) scale(1.2) rotate('+(spin?200:-12)+'deg)', opacity:1, offset:.5 },
      { transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(.25) rotate('+(spin?400:0)+'deg)', opacity:.3 }
    ], { duration:620, easing:'cubic-bezier(.45,0,.25,1)' });
    a.onfinish=function(){ f.remove(); replay(target, 'gulp'); };
  }
  function confettiAt(x, y){
    if(REDUCE || !document.body.animate) return;
    var cols=['#7F77DD','#1D9E75','#EF9F27','#D4537E','#378ADD','#E24B4A'];
    for(var i=0;i<22;i++){
      var p=document.createElement('div'); p.className='confetti'; p.style.background=cols[i%cols.length];
      p.style.left=x+'px'; p.style.top=y+'px'; document.body.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=60+Math.random()*90, dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-50;
      p.animate([
        { transform:'translate(-50%,-50%) rotate(0deg)', opacity:1 },
        { transform:'translate('+dx+'px,'+(dy+120)+'px) rotate('+(Math.random()*720-360)+'deg)', opacity:0 }
      ], { duration:900+Math.random()*500, easing:'cubic-bezier(.2,.7,.4,1)' }).onfinish=(function(el){ return function(){ el.remove(); }; })(p);
    }
  }
  // Remembers each cube's last roll count / fullness so only changes animate
  var cubeMemo={}, celebrate=[], spun=null;

  function bagCubes(b){ if(!state.cubes[b]) state.cubes[b]=[]; return state.cubes[b]; }
  function findCube(b, id){ var r=null; bagCubes(b).forEach(function(c){ if(c.id===id) r=c; }); return r; }
  function cubeEntries(c){ return Object.keys(state.items).filter(function(id){ var v=state.items[id]; return v && v.cube===c.id; }).map(function(id){ return { m:META[id], n:state.items[id].n||META[id].q||1 }; }); }
  function colorFor(m){ var p=packFor(m); if(p.pal) return p.pal[0]; var h=0; for(var i=0;i<m.id.length;i++) h=(h*31+m.id.charCodeAt(i))>>>0; return SPARE_COLORS[h%SPARE_COLORS.length]; }
  // Fills a cube by share of its capacity; each item gets a band along the long side
  function cubeLayout(c){
    var cap=capOf(c), used=0, over=0, units=0, bands=[], entries=cubeEntries(c);
    entries.forEach(function(e){
      var p=packFor(e.m), fit=0;
      for(var i=0;i<e.n;i++){ if(used+p.cost>cap+1e-6) over++; else { used+=p.cost; fit++; } }
      if(fit) bands.push({ m:e.m, p:p, n:fit, share:fit*p.cost/cap });
      units+=fit;
    });
    var minCost=entries.reduce(function(a, e){ return Math.min(a, packFor(e.m).cost); }, Infinity);
    return { bands:bands, units:units, over:over, ratio:used/cap, count:entries.length, room:cap-used >= minCost-1e-6 };
  }
  function fillStatus(L){
    if(L.over) return { cls:'over', text:'This won’t zip — '+L.over+' too many' };
    if(L.ratio>=0.999 || (L.count && !L.room)) return { cls:'snug', text:'Full to the brim' };
    if(L.ratio>=0.75) return { cls:'snug', text:'Getting snug in here…' };
    return { cls:'', text:'' };
  }
  // ---- Folded-garment drawings (cm units; long side runs left→right) ----
  function rgbOf(hex){ var n=parseInt(hex.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
  function shade(hex, t){ var c=rgbOf(hex), f=t<0?0:255, a=Math.abs(t); return 'rgb('+c.map(function(v){ return Math.round(v+(f-v)*a); }).join(',')+')'; }
  function isDark(hex){ var c=rgbOf(hex); return (c[0]*299+c[1]*587+c[2]*114)/1000 < 120; }
  var EDGE=' stroke="rgba(0,0,0,.38)" stroke-width="0.12"';
  function ln(x1,y1,x2,y2,col,w){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(w||.15)+'" stroke-linecap="round"/>'; }
  function dot(x,y,r,col){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'"/>'; }
  // A flat-folded garment seen from above; only the top one of a stack gets its details
  function foldedGarment(look, x, y, w, h, col, top){
    var dk=isDark(col), det=shade(col, dk ? .32 : -.32), deep=shade(col, dk ? .5 : -.5), r=Math.min(1.4,h*.08);
    var g='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+col+'"'+EDGE+'/>';
    if(!top) return g;
    if(look==='pants' || look==='jeans'){
      // waistband with gathered elastic, a belt loop, and the welt back pocket with its button
      var wb=Math.min(3, w*.13);
      g+='<rect x="'+x+'" y="'+y+'" width="'+wb+'" height="'+h+'" rx="'+r+'" fill="'+shade(col, dk ? .12 : -.14)+'"/>';
      for(var yy=y+1; yy<y+h-.6; yy+=1.1) g+=ln(x+.35, yy, x+wb-.35, yy, det, .12);
      g+='<rect x="'+(x+wb-.4)+'" y="'+(y+h*.16)+'" width="1.6" height=".8" rx=".3" fill="'+shade(col, dk ? .2 : -.2)+'"'+EDGE+'/>';
      var px=x+wb+w*.2;
      g+='<rect x="'+(px-.18)+'" y="'+(y+h*.2)+'" width=".36" height="'+(h*.42)+'" rx=".18" fill="'+deep+'"/>'+dot(px+1, y+h*.41, .5, deep);
      if(look==='jeans') g+='<path d="M'+(x+wb+.6)+' '+(y+.7)+' H'+(x+w-.6)+' M'+(x+wb+.6)+' '+(y+h-.7)+' H'+(x+w-.6)+'" stroke="#e0aa5e" stroke-width=".14" stroke-dasharray=".45 .3" fill="none"/>';
      else g+=ln(x+w*.62, y+h*.5, x+w-.6, y+h*.5, det, .1);
    } else if(look==='shirt'){
      // collar points, button placket and the folded-in sleeves
      var cy=y+h/2;
      g+='<path d="M'+(x+.4)+' '+(cy-h*.3)+' L'+(x+w*.2)+' '+cy+' L'+(x+.4)+' '+(cy+h*.3)+' Z" fill="'+shade(col, dk ? .1 : -.1)+'" stroke="'+det+'" stroke-width=".2" stroke-linejoin="round"/>';
      g+='<path d="M'+(x+.4)+' '+(cy-h*.3)+' L'+(x+w*.13)+' '+(cy-h*.08)+' M'+(x+.4)+' '+(cy+h*.3)+' L'+(x+w*.13)+' '+(cy+h*.08)+'" stroke="'+det+'" stroke-width=".2" fill="none"/>';
      g+=ln(x+w*.2, cy-.45, x+w-.5, cy-.45, det, .14)+ln(x+w*.2, cy+.45, x+w-.5, cy+.45, det, .14);
      for(var b=0;b<4;b++) g+=dot(x+w*(.32+b*.17), cy, .45, deep);
      g+=ln(x+w*.44, y+.4, x+w*.6, y+h*.24, det, .16)+ln(x+w*.44, y+h-.4, x+w*.6, y+h*.76, det, .16);
    } else if(look==='hoodie'){
      g+='<path d="M'+x+' '+(y+h*.18)+' Q'+(x+w*.32)+' '+(y+h*.5)+' '+x+' '+(y+h*.82)+'" fill="'+shade(col, dk ? .12 : -.15)+'" stroke="'+det+'" stroke-width=".2"/>';
      g+=ln(x+w*.18, y+h*.43, x+w*.42, y+h*.41, det, .16)+ln(x+w*.18, y+h*.57, x+w*.42, y+h*.59, det, .16);
      g+='<rect x="'+(x+w*.6)+'" y="'+(y+h*.28)+'" width="'+(w*.28)+'" height="'+(h*.44)+'" rx=".8" fill="none" stroke="'+det+'" stroke-width=".2"/>';
    } else if(look==='jacket'){
      g+=ln(x+w*.08, y+h*.5, x+w-.4, y+h*.5, det, .25)+'<path d="M'+(x+w*.04)+' '+(y+h*.25)+' L'+(x+w*.16)+' '+(y+h*.5)+' L'+(x+w*.04)+' '+(y+h*.75)+'" fill="none" stroke="'+det+'" stroke-width=".22"/>';
      g+='<rect x="'+(x+w*.55)+'" y="'+(y+h*.12)+'" width="'+(w*.3)+'" height=".6" rx=".3" fill="'+det+'"/><rect x="'+(x+w*.55)+'" y="'+(y+h*.8)+'" width="'+(w*.3)+'" height=".6" rx=".3" fill="'+det+'"/>';
    }
    return g;
  }
  // One file-folded piece (a tee, shorts, pajama shorts, towel...) standing in a row
  function filedPiece(look, x, y, w, h, col){
    var det=isDark(col) ? 'rgba(255,255,255,.22)' : 'rgba(0,0,0,.22)', rx=Math.min(w,h)*.22;
    var g='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="'+col+'"'+EDGE+'/>';
    if(look==='tee'){
      g+='<path d="M'+(x+w*.18)+' '+(y+h*.1)+' Q'+(x+w*.5)+' '+(y+h*.03)+' '+(x+w*.82)+' '+(y+h*.1)+'" fill="none" stroke="'+det+'" stroke-width=".16"/>';
      g+=ln(x+w*.8, y+h*.18, x+w*.8, y+h*.86, det, .14);
    } else if(look==='shorts' || look==='pjshorts'){
      var band=Math.min(h*.18, 3.2), base=look==='pjshorts' ? '#f4f6fb' : col;
      if(look==='pjshorts'){ g='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="'+base+'"'+EDGE+'/>'; for(var k=1;k<6;k++) g+=ln(x+w*k/6, y+band+.3, x+w*k/6, y+h-.4, '#4a6fb5', .22); }
      g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+band+'" rx="'+rx+'" fill="'+shade(base,-.12)+'"/>';
      for(var r=1;r<4;r++) g+=ln(x+.35, y+band*r/4, x+w-.35, y+band*r/4, det, .1);
      if(look==='shorts') g+=ln(x+w*.5, y+band+.5, x+w*.5, y+h*.55, det, .12);
    } else if(look==='towel'){
      g+=ln(x+.3, y+h*.3, x+w-.3, y+h*.3, '#fff', .5)+ln(x+.3, y+h*.7, x+w-.3, y+h*.7, '#fff', .5);
    }
    return g;
  }
  function drawBand(bd, x, y, w, h){
    var p=bd.p, n=bd.n, out=[], pal=p.pal || [colorFor(bd.m)];
    if(p.style==='stack'){
      // Folded flat and stacked: the top garment shows its details, the ones beneath peek out at the edges
      var layers=Math.min(n, 5), off=Math.min(.7, w*.04), gw=w-.2-(layers-1)*off, gh=h-.2-(layers-1)*off*.8;
      for(var i=0;i<n;i++){ var d=Math.min(n-1-i, layers-1); out.push(foldedGarment(p.look, x+.1+d*off, y+.1+d*off*.8, gw, gh, pal[(n-1-i)%pal.length], i===n-1)); }
      return out;
    }
    var rows=p.style==='grid' ? (p.rows||2) : 1, count=p.look==='pjs' ? n*2 : n, cols=Math.ceil(count/rows), sw=w/cols, sh=h/rows, gap=Math.min(.25, sw*.08);
    for(var k=0;k<count;k++){
      var cx=x+Math.floor(k/rows)*sw+gap/2, cy=y+(k%rows)*sh+gap/2, cw=sw-gap, ch=sh-gap, col=pal[k%pal.length];
      if(p.look==='pjs') out.push(filedPiece(k%2 ? 'pjshorts' : 'tee', cx, cy, cw, ch, '#f2efe8'));
      else if(p.style==='file') out.push(filedPiece(p.look, cx, cy, cw, ch, col));
      else if(p.style==='grid') out.push('<rect x="'+cx+'" y="'+cy+'" width="'+cw+'" height="'+ch+'" rx="'+Math.min(cw,ch)/2+'" fill="'+col+'"'+EDGE+'/>'+ln(cx+cw*.3, cy+ch*.2, cx+cw*.3, cy+ch*.8, 'rgba(255,255,255,.3)', .2));
      else if(p.style==='shoe') out.push('<rect x="'+cx+'" y="'+cy+'" width="'+cw+'" height="'+(ch*.47)+'" rx="'+(ch*.2)+'" fill="'+col+'"'+EDGE+'/><rect x="'+cx+'" y="'+(cy+ch*.53)+'" width="'+cw+'" height="'+(ch*.47)+'" rx="'+(ch*.2)+'" fill="'+col+'"'+EDGE+'/>'+ln(cx+cw*.55, cy+ch*.12, cx+cw*.8, cy+ch*.12, 'rgba(255,255,255,.35)', .25)+ln(cx+cw*.55, cy+ch*.65, cx+cw*.8, cy+ch*.65, 'rgba(255,255,255,.35)', .25));
      else out.push('<rect x="'+cx+'" y="'+cy+'" width="'+cw+'" height="'+ch+'" rx=".8" fill="'+colorFor(bd.m)+'"'+EDGE+'/>');
    }
    return out;
  }
  // The whole cube's contents; pieces at index ≥ from pop in
  function garmentSvg(c, L, from){
    var long=Math.max(c.w,c.h), short=Math.min(c.w,c.h), pad=.35, x0=pad, avail=long-pad*2, H=short-pad*2, g='', ui=0;
    var tf=c.w<c.h ? ' transform="matrix(0,1,-1,0,'+c.w+',0)"' : '';
    L.bands.forEach(function(bd){
      var bw=avail*bd.share;
      drawBand(bd, x0, pad, bw, H).forEach(function(sv){ g+= ui>=from ? '<g class="roll-new" style="--i:'+(ui-from)+'">'+sv+'</g>' : sv; ui++; });
      x0+=bw;
    });
    return { svg:'<svg class="rolls" viewBox="0 0 '+c.w+' '+c.h+'" preserveAspectRatio="none"><g'+tf+'>'+g+'</g></svg>', pieces:ui };
  }
  function scaleFor(b){ var d=BAG_DIMS[b]; return Math.min(11, 620/d.l, 260/d.w); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
  function sideOf(c){ return c.side||'base'; }
  function fits(b, selfId, x, y, w, h, side){
    var d=BAG_DIMS[b];
    if(x<0 || y<0 || x+w>d.l || y+h>d.w) return false;
    return bagCubes(b).every(function(o){ return o.id===selfId || sideOf(o)!==(side||'base') || x+w<=o.x || o.x+o.w<=x || y+h<=o.y || o.y+o.h<=y; });
  }
  function flash(msg){
    var m=document.getElementById('studio-msg'); if(!m) return;
    m.textContent=msg; m.classList.add('show');
    clearTimeout(flashTimer); flashTimer=setTimeout(function(){ m.classList.remove('show'); }, 2400);
  }
  function setHover(el){
    if(hoverCube===el) return;
    if(hoverCube) hoverCube.classList.remove('drop-hover');

  }
  function openStudio(b){
    if(closingStudio){ clearTimeout(closeTimer); closingStudio=false; }
    studioBag=b; renderStudio(true);
    var h=document.getElementById('studio'); if(h) h.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
  // Closing plays the opening in reverse: lid swings shut, zip closes, the bag tilts back
  // and flies home into its spot in the bag row
  var closingStudio=false, closeTimer=null;
  function closeStudio(){
    if(!studioBag || closingStudio) return;
    var b=studioBag, host=document.getElementById('studio'), sc=document.getElementById('scene'), stage=host && host.querySelector('.stage');
    var done=false;
    function finish(){
      if(done) return; done=true;
      closingStudio=false; studioBag=null; selCube=null; renderStudio(false);
      var dock=scPack.querySelector('.bag[data-bag="'+b+'"]');
      if(dock){ dock.scrollIntoView({ behavior:'smooth', block:'nearest' }); replay(dock, 'gulp'); }
    }
    if(REDUCE || !sc || !stage || !stage.animate){ finish(); return; }
    closingStudio=true;
    host.querySelector('.studio').classList.add('studio-closing');
    sc.classList.add('closing'); sc.classList.remove('settled'); void sc.offsetWidth; sc.classList.remove('open');
    closeTimer=setTimeout(function(){
      var dock=scPack.querySelector('.bag[data-bag="'+b+'"]'); if(!dock){ finish(); return; }
      var r1=stage.getBoundingClientRect(), r2=dock.getBoundingClientRect();
      var dx=(r2.left+r2.width/2)-(r1.left+r1.width/2), dy=(r2.top+r2.height/2)-(r1.top+r1.height/2);
      stage.animate([
        { transform:'none', opacity:1 },
        { transform:'translate('+dx*0.45+'px,'+(dy*0.45-40)+'px) scale(.5) rotate(-6deg)', opacity:.9, offset:.45 },
        { transform:'translate('+dx+'px,'+dy+'px) scale(.1) rotate(4deg)', opacity:0 }
      ], { duration:165, easing:'cubic-bezier(.5,0,.3,1)', fill:'forwards' }).onfinish=finish;
      setTimeout(finish, 240);
    }, 650);
  }

  function removeCube(b, id){
    // Whatever was inside goes back to the item list, ready to pack again
    var back=0;
    Object.keys(state.items).forEach(function(k){ var v=state.items[k]; if(v && v.cube===id){ state.items[k]='available'; back++; } });
    state.cubes[b]=bagCubes(b).filter(function(c){ return c.id!==id; });
    if(selCube===id) selCube=null;
    refresh();
    if(back) flash(back+(back===1?' item is':' items are')+' back in the list.');
  }

  function cubeHtml(c, s){
    var t=CUBE_TYPES[c.type], L=cubeLayout(c), st=fillStatus(L), empty=!L.count;
    var mem=cubeMemo[c.id], full=!L.over && L.count>0 && (L.ratio>=0.999 || !L.room), gs=empty ? { svg:'', pieces:0 } : garmentSvg(c, L, mem ? mem.n : Infinity);
    var jolt=mem && L.over && !mem.over;
    if(mem && full && !mem.full) celebrate.push(c.id);

    return '<div class="cube kind-'+t.kind+(empty?' empty':'')+(st.cls?' '+st.cls:'')+(selCube===c.id?' sel':'')+(jolt?' jolt':'')+'" data-cube="'+c.id+'" style="left:'+(c.x*s)+'px;top:'+(c.y*s)+'px;width:'+(c.w*s)+'px;height:'+(c.h*s)+'px;background:'+bg+';color:'+fg+';border-color:#1a1a18;">'
      +gs.svg

      +'<div class="ce-meter '+st.cls+'"><i style="width:'+Math.min(100,pct)+'%"></i></div>'
      +(st.text?'<div class="ce-status '+st.cls+'">'+st.text+'</div>':'')
      +(rows||'<div class="ce-empty">Empty. Drag items from the list below onto this cube.</div>')+'</div>';
  }

  // Best spot for a w×h cube near (x,y): snaps to walls and neighbouring edges, tries
  // the preferred orientation first, then auto-rotates, then searches a few cm around.
  function placeNear(b, selfId, x, y, w, h, allowRotate, side, anywhere){
    var d=BAG_DIMS[b], others=bagCubes(b).filter(function(o){ return o.id!==selfId && sideOf(o)===(side||'base'); });
    function magnet(v, size, max, axis){
      var best=Math.round(v), bd=2.01, targets=[0, max-size];
      others.forEach(function(o){ var a=axis==='x'?o.x:o.y, s=axis==='x'?o.w:o.h; targets.push(a+s, a-size); });
      targets.forEach(function(t){ if(Math.abs(t-v)<bd){ bd=Math.abs(t-v); best=t; } });
      return best;
    }
    var cx=x+w/2, cy=y+h/2, orients=[[w,h,false]];
    if(allowRotate && w!==h) orients.push([h,w,true]);
    function tryAt(o, radius){
      if(o[0]>d.l || o[1]>d.w) return null;
      var bx=clamp(magnet(cx-o[0]/2, o[0], d.l, 'x'), 0, d.l-o[0]);
      var by=clamp(magnet(cy-o[1]/2, o[1], d.w, 'y'), 0, d.w-o[1]);
      for(var r=0; r<=radius; r++){
        for(var dx=-r; dx<=r; dx++) for(var dy=-r; dy<=r; dy++){
          if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
          var px=bx+dx, py=by+dy;
          if(fits(b, selfId, px, py, o[0], o[1], side)) return { x:px, y:py, w:o[0], h:o[1], rotated:o[2], ok:true };
        }
      }
      return null;
    }
    var hit=null;
    (anywhere ? [0,3,Math.ceil(Math.max(d.l,d.w))] : [0,3]).forEach(function(rad){ orients.forEach(function(o){ if(!hit) hit=tryAt(o, rad); }); });
    if(hit) return hit;
    var fw=Math.min(w,d.l), fh=Math.min(h,d.w);
    return { x:clamp(Math.round(cx-fw/2),0,d.l-fw), y:clamp(Math.round(cy-fh/2),0,d.w-fh), w:fw, h:fh, rotated:false, ok:false };
  }

  function bagShellHtml(b, s){

    return '<div class="shell '+d.style+'" id="shell" style="width:'+W+'px;height:'+H+'px;padding:'+rim+'px;box-sizing:border-box;background:'+d.color+';'+gap+'">'
      +'<div class="rimshade"></div>'+extras
      +'<div class="wall" style="height:'+Math.round(d.d*s*0.55)+'px;background-color:'+d.color+'"></div>'
      +interior('base')+lidFlat+hangerHtml(b, W)
      +'<div class="lid">'+out+inn+'<svg class="zip" viewBox="0 0 '+W+' '+H+'"><g class="teeth">'+zipPath+'</g><g class="shut">'+zipPath+'</g></svg></div>'
      +'</div>';
  }

  function rotateCube(b, id){
    var c=findCube(b, id); if(!c) return;
    var p=placeNear(b, c.id, c.x+(c.w-c.h)/2, c.y+(c.h-c.w)/2, c.h, c.w, false, sideOf(c), true);
    if(!p.ok){ flash('No room anywhere to turn that one. Move something first.'); replay(document.querySelector('.cube[data-cube="'+id+'"]'), 'jolt'); return; }
    var moved=Math.abs(p.x-(c.x+(c.w-c.h)/2))>3 || Math.abs(p.y-(c.y+(c.h-c.w)/2))>3;
    c.x=p.x; c.y=p.y; c.w=p.w; c.h=p.h; selCube=c.id; spun=c.id; refresh();
    if(moved) flash('Turned it and slid it over to make it fit.');
  }

  // Cubes move with pointer events (not native drag) so the footprint can follow the
  // cursor live and the R key / scroll wheel can rotate mid-drag.
  var cdrag=null;
  function cubeDragStart(e, kind, ref){
    var b=studioBag, w, h, off;
    if(kind==='new'){ var t=CUBE_TYPES[ref]; w=t.w; h=t.h; off=null; }
    else {
      var c=findCube(b, ref); if(!c) return;
      var el=document.querySelector('.cube[data-cube="'+ref+'"]'), r=el.getBoundingClientRect(), sc=r.width/c.w;
      w=c.w; h=c.h; off={ x:(e.clientX-r.left)/sc, y:(e.clientY-r.top)/sc };
    }
    cdrag={ kind:kind, ref:ref, w:w, h:h, off:off, sx:e.clientX, sy:e.clientY, lastX:e.clientX, lastY:e.clientY, live:false, place:null, flyer:null };
    window.addEventListener('pointermove', cubeDragMove);
    window.addEventListener('pointerup', cubeDragEnd);
    window.addEventListener('pointercancel', cubeDragCancel);
    window.addEventListener('keydown', cubeDragKey);
    window.addEventListener('wheel', cubeDragWheel, { passive:false });
    e.preventDefault();
  }
  function cubeDragRotate(){
    if(!cdrag) return;
    var t=cdrag.w; cdrag.w=cdrag.h; cdrag.h=t; cdrag.off=null;
    cubeDragUpdate(cdrag.lastX, cdrag.lastY);
  }
  function cubeDragKey(e){ if(e.key==='r' || e.key==='R'){ e.preventDefault(); cubeDragRotate(); } else if(e.key==='Escape') cubeDragCancel(); }
  function cubeDragWheel(e){ if(!cdrag || !cdrag.live) return; e.preventDefault(); if(Math.abs(e.deltaY)>4 || Math.abs(e.deltaX)>4) cubeDragRotate(); }
  function cubeDragMove(e){
    if(!cdrag) return;
    cdrag.lastX=e.clientX; cdrag.lastY=e.clientY;
    if(!cdrag.live){
      if(Math.abs(e.clientX-cdrag.sx)+Math.abs(e.clientY-cdrag.sy)<5) return;
      cdrag.live=true; hidePeek(); document.body.classList.add('cube-dragging');
      if(cdrag.kind==='move'){ var el=document.querySelector('.cube[data-cube="'+cdrag.ref+'"]'); if(el) el.classList.add('lifting'); }
      var f=document.createElement('div'); f.className='flyer'; document.body.appendChild(f); cdrag.flyer=f;
    }
    cubeDragUpdate(e.clientX, e.clientY);
  }
  function cubeDragUpdate(cx, cy){
    var inners=[].slice.call(document.querySelectorAll('#studio .interior'));
    if(!cdrag || !cdrag.live || !inners.length) return;
    var b=studioBag, d=BAG_DIMS[b], sc=inners[0].getBoundingClientRect().width/d.l, pad=3*sc, inner=null, r=null;
    inners.forEach(function(el){
      var rr=el.getBoundingClientRect();
      if(!inner && rr.width && cx>rr.left-pad && cx<rr.right+pad && cy>rr.top-pad && cy<rr.bottom+pad){ inner=el; r=rr; }
      else el.querySelector('.ghost').className='ghost';
    });
    var label=(cdrag.kind==='new' ? CUBE_TYPES[cdrag.ref].label : CUBE_TYPES[findCube(b, cdrag.ref).type].label);
    var f=cdrag.flyer, offX=cdrag.off ? cdrag.off.x : cdrag.w/2, offY=cdrag.off ? cdrag.off.y : cdrag.h/2;
    f.style.width=(cdrag.w*sc)+'px'; f.style.height=(cdrag.h*sc)+'px';
    f.style.left=(cx-offX*sc)+'px'; f.style.top=(cy-offY*sc)+'px'; f.textContent=label;
    if(!inner){ cdrag.place=null; f.classList.remove('hidden'); return; }
    f.classList.add('hidden');
    var ghost=inner.querySelector('.ghost'), side=inner.dataset.side;
    var p=placeNear(b, cdrag.kind==='move'?cdrag.ref:null, (cx-r.left)/sc-offX, (cy-r.top)/sc-offY, cdrag.w, cdrag.h, true, side);
    p.side=side; cdrag.place=p;
    ghost.className='ghost '+(p.ok?'ok':'bad');
    ghost.style.left=(p.x*sc)+'px'; ghost.style.top=(p.y*sc)+'px'; ghost.style.width=(p.w*sc)+'px'; ghost.style.height=(p.h*sc)+'px';
    ghost.textContent=p.ok ? (p.rotated ? 'Fits, turned ↻' : 'Fits') : 'Won’t fit';
  }
  function cubeDragStop(){
    window.removeEventListener('pointermove', cubeDragMove);
    window.removeEventListener('pointerup', cubeDragEnd);
    window.removeEventListener('pointercancel', cubeDragCancel);
    window.removeEventListener('keydown', cubeDragKey);
    window.removeEventListener('wheel', cubeDragWheel);
    document.body.classList.remove('cube-dragging');
    if(cdrag && cdrag.flyer) cdrag.flyer.remove();
    document.querySelectorAll('#studio .ghost').forEach(function(g){ g.className='ghost'; });
    document.querySelectorAll('.cube.lifting').forEach(function(el){ el.classList.remove('lifting'); });
    var c=cdrag; cdrag=null; return c;
  }
  function cubeDragCancel(){ cubeDragStop(); }
  function cubeDragEnd(){
    var c=cubeDragStop(); if(!c || !c.live) return;
    var p=c.place, b=studioBag;
    if(!p) return;
    if(!p.ok){ flash(c.kind==='new' ? 'That one won’t fit there. Try a bigger gap.' : 'It bumps into another cube.'); return; }
    if(c.kind==='new'){
      var t=CUBE_TYPES[c.ref], id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      bagCubes(b).push({ id:id, type:c.ref, side:p.side, x:p.x, y:p.y, w:p.w, h:p.h, cat:t.cat, cap:null });
      lastPlaced=id; selCube=id;
    } else {
      var cube=findCube(b, c.ref); if(!cube) return;
      cube.side=p.side; cube.x=p.x; cube.y=p.y; cube.w=p.w; cube.h=p.h; lastPlaced=cube.id;
    }
    if(p.rotated) flash('Turned it sideways so it fits.');
    refresh();
  }

  function wireStudio(host){
    host.addEventListener('pointerdown', function(e){
      if(e.button!==0 || e.target.closest('button,select,input')) return;
      var tile=e.target.closest('.pal-tile'); if(tile){ cubeDragStart(e, 'new', tile.dataset.type); return; }
      var bar=e.target.closest('.cube-bar'); if(bar) cubeDragStart(e, 'move', bar.dataset.cube);
    });
    // Native drag is only used for items coming from the drawers
    host.addEventListener('dragend', function(){ setHover(null); });
    host.addEventListener('dragover', function(e){
      var hg=e.target.closest('.hanger');
      host.querySelectorAll('.hanger.drop-ready').forEach(function(x){ if(x!==hg) x.classList.remove('drop-ready'); });
      if(dragKind==='item' && hg){ e.preventDefault(); hg.classList.add('drop-ready'); return; }
      if(dragKind!=='item' || !e.target.closest('.interior')) return;
      e.preventDefault();
      setHover(e.target.closest('.cube'));
    });
    host.addEventListener('drop', function(e){
      var hg=e.target.closest('.hanger');
      if(hg && dragKind==='item' && draggingId){ e.preventDefault(); state.items[draggingId]={ bag:studioBag, spot:hg.dataset.spot }; clearDrag(); refresh(); replay(host.querySelector('.hanger[data-spot="'+hg.dataset.spot+'"]'), 'gulp'); return; }
      var inner=e.target.closest('.interior'); if(!inner || dragKind!=='item' || !draggingId) return;
      e.preventDefault(); setHover(null);
      var ce=e.target.closest('.cube');
      // Items only go into a cube, case or pouch, never loose in the bag
      if(!ce){ clearDrag(); flash('Drop it onto a cube or case, not loose in the bag.'); replay(inner, 'jolt'); return; }
      var cube=findCube(studioBag, ce.dataset.cube), m=META[draggingId], pk=packFor(m), want=m.q||1;
      var space=capOf(cube)*(1-cubeLayout(cube).ratio), n=Math.max(1, Math.min(want, Math.floor(space/pk.cost+1e-6)));
      state.items[draggingId] = { bag:studioBag, cube:ce.dataset.cube, n:n };
      selCube=ce.dataset.cube;
      clearDrag(); refresh();
      if(n<want) flash('Fitted '+n+' of '+want+' '+m.name+'. Use a bigger cube for all '+want+'.');
    });
    host.addEventListener('click', function(e){
      var x=e.target.closest('.cube-x'); if(x){ removeCube(studioBag, x.dataset.cube); return; }
      var rt=e.target.closest('.cube-rot, .ce-rot'); if(rt){ rotateCube(studioBag, rt.dataset.cube); return; }
      var stp=e.target.closest('[data-step]'); if(stp){ setCount(stp.dataset.id, (state.items[stp.dataset.id].n||1)+parseInt(stp.dataset.step,10)); return; }
      var hx=e.target.closest('.hx'); if(hx){ state.items[hx.dataset.id]='available'; refresh(); return; }
      if(e.target.closest('.hanger.look-wallet')){ openWallet(studioBag); return; }
      var out=e.target.closest('.ce-out'); if(out){ state.items[out.dataset.id]='available'; refresh(); return; }
      var cb=e.target.closest('.cube'); if(cb && e.detail===2 && !e.target.closest('select,input,button')){ rotateCube(studioBag, cb.dataset.cube); return; }
      if(cb){ if(selCube!==cb.dataset.cube){ selCube=cb.dataset.cube; renderStudio(false); } return; }
      if(e.target.closest('#loose-back')){ Object.keys(state.items).forEach(function(k){ var v=state.items[k]; if(v && v.bag===studioBag && !v.cube && !v.spot) state.items[k]='available'; }); refresh(); return; }
      if(e.target.closest('#studio-close')){ closeStudio(); }
    });
    host.addEventListener('input', function(e){
      var t=e.target; if(!t.classList.contains('cnt')) return;
      var v=parseInt(t.value, 10); if(v>0) setCount(t.dataset.id, v, true);
    });
    host.addEventListener('change', function(e){
      var t=e.target; if(t.classList.contains('cnt') && !(parseInt(t.value,10)>0)) refresh();
    });
  }

  // Live count changes redraw the rolls; keep the caret in the box while typing
  function setCount(id, n, typing){
    var v=state.items[id]; if(!v || !v.cube) return;
    v.n=Math.max(1, Math.min(99, n));
    refresh();
    if(typing){ var inp=document.querySelector('#cube-editor .cnt[data-id="'+id+'"]'); if(inp){ inp.focus(); var l=inp.value.length; inp.setSelectionRange(l, l); } }
  }

  function refresh(){ renderDrawers(); renderRec(); renderBin(); updateBadges(); renderStudio(false); saveState(); }

  function renderRec(){
    var host=scPack.querySelector('#rec-list'); if(!host) return;
    var html='';
    DATA.forEach(function(d){
      if(d.name!=='Clothing' && d.name!=='Extras') return;
      d.subs.forEach(function(sub){ sub.items.forEach(function(it){
        if(!it.q || state.items[it.id]==='binned') return;
        var v=state.items[it.id], packed=v && v.bag ? (v.cube ? (v.n||it.q) : it.q) : 0;
        html+='<div class="rec-item'+(packed>=it.q?' met':'')+'">'+iconHtml(it.n, it.i)+it.n+'<span class="rq">'+(packed?packed+' / ':'')+it.q+(packed>=it.q?' <i class="ti ti-check"></i>':'')+'</span></div>';
      }); });
    });
    host.innerHTML=html;
  }

  function renderDrawers(){
    var host = scPack.querySelector('#drawers');
    var qEl = scPack.querySelector('#item-search'), query = qEl ? qEl.value.trim().toLowerCase() : '';
    var open = {}; host.querySelectorAll('.drawer.open').forEach(function(d){ open[d.dataset.dom]=1; });
    var html = ''; var anyLeft = false;
    DATA.forEach(function(d){
      var subsHtml = '';
      d.subs.forEach(function(sub){
        var chips = '';
        sub.items.forEach(function(it){
          if(state.items[it.id] !== 'available') return;
          if(query && it.n.toLowerCase().indexOf(query)<0 && sub.name.toLowerCase().indexOf(query)<0) return;
          chips += '<div class="chip" draggable="true" data-id="'+it.id+'">'+iconHtml(it.n, it.i)+'<span class="nm">'+it.n+'</span></div>';
        });
        if(chips){ subsHtml += '<div class="subhead">'+sub.name+'</div><div class="chip-grid">'+chips+'</div>'; }
      });
      if(subsHtml){
        anyLeft = true;
        var isOpen = (open[d.name] || query) ? ' open' : '';
        html += '<div class="drawer'+isOpen+'" data-dom="'+d.name+'"><button class="drawer-head"><i class="ti '+d.icon+' dh-icon"></i>'+d.name+'<i class="ti ti-chevron-down chev"></i></button><div class="drawer-body">'+subsHtml+'</div></div>';
      }
    });
    if(!anyLeft && query){ html = '<div class="empty-note">Nothing matches “'+esc(query)+'”.</div>'; }

  function renderBin(){
    var ids = Object.keys(state.items).filter(function(id){ return state.items[id]==='binned'; });
    scPack.querySelector('#bin-label').textContent = 'Not this trip ('+ids.length+')';
    var list = scPack.querySelector('#bin-list');
    if(!ids.length){ list.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">Drag anything here to set it aside. Click to bring it back.</span>'; return; }
    list.innerHTML = ids.map(function(id){ var m=META[id]; return '<span class="pit" data-id="'+id+'">'+iconHtml(m.name, m.icon)+m.name+' <i class="ti ti-arrow-back-up"></i></span>'; }).join('');
  }

  function updateBadges(){
    state.bags.forEach(function(id){
      var n = Object.keys(state.items).filter(function(k){ var v=state.items[k]; return v && v.bag===id; }).length;
      var el = scPack.querySelector('[data-count="'+id+'"]');
      var txt = n+(n===1?' item':' items');
      if(el && el.textContent!==txt){ var was=el.textContent; el.textContent = txt; if(was) replay(el, 'bump'); }
    });
  }

  function groupFor(bagId){
    var groups = {};
    Object.keys(state.items).forEach(function(id){
      var v=state.items[id]; if(!v || v.bag!==bagId) return;
      var m=META[id], key=m.sub;
      if(v.cube){ var c=findCube(bagId, v.cube); if(c) key=CUBE_TYPES[c.type].label+(sideOf(c)==='lid'?' (lid side)':''); }
      if(v.spot){ var hg=hangerFor(bagId, v.spot); if(hg) key=hg.label+' (outside)'; }
      (groups[key]=groups[key]||[]).push(v.cube ? Object.assign({}, m, { n:v.n||m.q||1 }) : m);
    });
    return groups;
  }

  function showPeek(bagId){
    var peek = scPack.querySelector('#peek'); peek.dataset.bag = bagId;
    var groups = groupFor(bagId); var keys = Object.keys(groups);
    var html = '<h4>'+BAGS[bagId].label+'</h4>';
    if(!keys.length){ html += '<div class="empty">Empty so far — drag items here to pack them.</div>'; }
    else {
      keys.forEach(function(k){
        html += '<div class="grp"><div class="subhead" style="margin:6px 0 2px;">'+k+'</div>';
        html += groups[k].map(function(m){ return '<span class="pit">'+iconHtml(m.name, m.icon)+m.name+(m.n>1?' ×'+m.n:'')+'</span>'; }).join('');
        html += '</div>';
      });
      html += '<div class="hint">'+(CUBE_BAGS.indexOf(bagId)>-1?'Click the bag to open it up.':'Click the bag for the full contents view.')+'</div>';
    }
    peek.innerHTML = html;
    peek.style.display = 'block';
    peek.style.top = (scPack.querySelector('#dock').offsetHeight + 8) + 'px';
  }
  function hidePeek(){ setTimeout(function(){ var peek=scPack.querySelector('#peek'); if(peek && peek.dataset.hold!=='1' && !isHovering()) peek.style.display='none'; }, 60); }
  function isHovering(){ var peek=scPack.querySelector('#peek'); if(!peek) return false; return peek.matches(':hover') || Array.prototype.some.call(scPack.querySelectorAll('.bag'), function(b){ return b.matches(':hover'); }); }

  function openContents(bagId){
    var box = scPack.querySelector('#modal-box');
    box.classList.remove('wallet-box');
    var groups = groupFor(bagId); var keys = Object.keys(groups);
    var count = keys.reduce(function(a,k){ return a+groups[k].length; }, 0);
    var html = '<div class="m-head">'+BAGS[bagId].svg+'<span class="m-title">'+BAGS[bagId].label+'</span><button class="m-close" aria-label="Close">&times;</button></div>';
    html += '<div class="m-count">'+count+(count===1?' item packed':' items packed')+'</div>';
    if(!keys.length){ html += '<div class="m-empty">Nothing packed in here yet. Drag items onto this bag to fill it.</div>'; }
    else {
      keys.forEach(function(k){
        html += '<div class="m-sub">'+k+'</div>';
        groups[k].forEach(function(m){ html += '<div class="m-item">'+iconHtml(m.name, m.icon, 'mi')+m.name+(m.n>1?' ×'+m.n:'')+'<button class="m-un" data-id="'+m.id+'">Remove</button></div>'; });
      });
    }
    box.innerHTML = html;
    box.querySelector('.m-close').onclick = function(){ scPack.querySelector('#modal').classList.remove('open'); };
    box.querySelectorAll('.m-un').forEach(function(b){ b.onclick = function(){ state.items[b.dataset.id]='available'; saveState(); refresh(); openContents(bagId); }; });
    scPack.querySelector('#modal').classList.add('open');
  }

  document.addEventListener('dragover', function(e){
    if(!draggingId) return;
    var edge=70, step=0;
    if(e.clientY<edge) step=-Math.ceil((edge-e.clientY)/4); else if(e.clientY>innerHeight-edge) step=Math.ceil((e.clientY-(innerHeight-edge))/4);
    if(!step) return;
    var side=document.getElementById('side');
    if(side && side.contains(e.target) && getComputedStyle(side).position==='sticky') side.scrollTop+=step; else window.scrollBy(0, step);
  });
  document.getElementById('undo-btn').addEventListener('click', undo);
  document.addEventListener('keydown', function(e){
    if(cdrag || e.metaKey || e.ctrlKey || e.altKey || (e.key!=='r' && e.key!=='R')) return;
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || !studioBag || !selCube || !findCube(studioBag, selCube)) return;
    e.preventDefault(); rotateCube(studioBag, selCube);
  });
  document.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key==='z' || e.key==='Z') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); }
  });
  loadState().then(function(restored){
    lastSnap = snapNow();
    updateShareVisibility();
    if(restored){
      buildPack();
      show(scPack);
    } else {
      buildBags();
      show(scBags);
    }
  });
})();
</script>
</body>
</html>
